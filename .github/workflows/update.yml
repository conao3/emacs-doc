name: Update

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    name: Update the catalogs and the site
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.3
      - name: Extract the msgids of the latest Emacs manuals
        run: nix develop --command make fetch-latest pot
      - name: Build the site
        run: nix develop --command make site stats package
      - name: Upload the site to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view site >/dev/null 2>&1 || gh release create site --title site --notes "The site deployed by Workers Builds (make fetch-site)." --latest=false
          gh release upload site build/dist.tar.zst --clobber
      - name: Commit the catalogs and the checksum of the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -I '^"POT-Creation-Date: ' -- po; then
            git checkout -- po
          fi
          git add EMACS_REVISION SITE_SHA256 po/*.ja.po
          if ! git diff --cached --quiet; then
            git commit -m "Update the site for Emacs $(cut -c1-10 EMACS_REVISION)"
            git push
          fi
