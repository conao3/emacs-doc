name: Update

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    name: Update the source and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.3
      - name: Extract the msgids of the latest Emacs manuals
        run: nix develop --command make fetch-latest pot
      - name: Commit the catalogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -I '^"POT-Creation-Date: ' -- po; then
            git checkout -- po
          fi
          git add EMACS_REVISION po/*.ja.po
          if ! git diff --cached --quiet; then
            git commit -m "Update the catalogs for Emacs $(cut -c1-10 EMACS_REVISION)"
            git push
          fi
      - name: Build the site
        run: nix develop --command make site stats
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: nix develop --command make deploy
